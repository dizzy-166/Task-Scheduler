<!DOCTYPE html>
<html>
<head>
    <title>Test API</title>
</head>
<body>
    <h1>Test Company Members API</h1>
    <button onclick="testMembers()">Get Members</button>
    <button onclick="testPending()">Get Pending</button>
    <div id="result"></div>

    <script>
        // Вставьте ваш токен и ID компании вручную для локального тестирования.
        // Никогда не коммитьте реальные токены в репозиторий.
        const token = prompt('Введите Bearer-токен:') || '';
        const companyId = prompt('Введите ID компании:') || '';

        async function testMembers() {
            try {
                const response = await fetch(`http://localhost:8000/api/v1/companies/${companyId}/members/`, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'X-Company-Id': companyId,
                        'Content-Type': 'application/json'
                    }
                });
                const data = await response.json();
                document.getElementById('result').innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
            } catch (error) {
                document.getElementById('result').innerHTML = `<pre>Error: ${error.message}</pre>`;
            }
        }

        async function testPending() {
            try {
                const response = await fetch(`http://localhost:8000/api/v1/companies/${companyId}/pending/`, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'X-Company-Id': companyId,
                        'Content-Type': 'application/json'
                    }
                });
                const data = await response.json();
                document.getElementById('result').innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
            } catch (error) {
                document.getElementById('result').innerHTML = `<pre>Error: ${error.message}</pre>`;
            }
        }
    </script>
</body>
</html>
